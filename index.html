<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>24시간 맞춤 자산·보험 무료 컨설팅</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html {
      width: 100%;
      height: 100%;
      background-color: #f4f6f9;
      -webkit-text-size-adjust: 100%;
    }
    body {
      width: 100%;
      min-height: 100vh;
      background-color: #f4f6f9;
      color: #333;
      display: block;
      padding: 12px;
      margin: 0 auto;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 500px;
      padding: 24px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #1e3a8a;
      font-size: 22px;
      margin-bottom: 8px;
      word-break: keep-all;
    }
    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
      word-break: keep-all;
    }
    .form-group {
      margin-bottom: 20px;
      width: 100%;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
      word-break: keep-all;
    }
    input[type="text"],
    input[type="tel"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px !important;
      -webkit-appearance: none;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }
    textarea {
      height: 80px;
      padding: 10px 12px;
      resize: vertical;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }
    
    .rrn-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .rrn-container input {
      flex: 1;
      width: 0;
      min-width: 0;
      text-align: center;
    }
    .rrn-dash {
      font-size: 18px;
      font-weight: bold;
      color: #555;
      flex-shrink: 0;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
    }
    .btn-group-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }
    .btn-option {
      width: 100%;
      height: 48px;
      padding: 0 4px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-option.active {
      background-color: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 8px;
      width: 100%;
      background-color: #f8fafc;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
      word-break: keep-all;
    }
    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .privacy-box {
      margin-top: 20px;
      font-size: 13px;
      color: #555;
      background-color: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      width: 100%;
    }
    .privacy-link {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
      margin-left: 5px;
    }
    .submit-btn {
      width: 100%;
      height: 52px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .modal-close {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>24시간 맞춤 무료 컨설팅</h2>
  <p class="subtitle">전문가와의 1:1 맞춤 무료 상담을 신청하세요.</p>

  <form id="consultForm">
    <!-- B열: 성함 -->
    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" required />
    </div>

    <!-- C열: 연락처 -->
    <div class="form-group">
      <label for="phone">연락처</label>
      <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" maxlength="13" required />
    </div>

    <!-- D열: 주민등록번호 -->
    <div class="form-group">
      <label for="rrn1">주민등록번호</label>
      <div class="rrn-container">
        <input 
          type="tel" 
          id="rrn1" 
          name="rrn1" 
          maxlength="6" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          placeholder="앞 6자리" 
          autocomplete="off" 
          required 
        />
        <span class="rrn-dash">-</span>
        <input 
          type="password" 
          id="rrn2" 
          name="rrn2" 
          maxlength="7" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          placeholder="뒤 7자리" 
          autocomplete="off" 
          required 
        />
      </div>
    </div>

    <!-- E열: 거주지역 (고객 주소) -->
    <div class="form-group">
      <label for="region">거주지역 (고객 주소)</label>
      <input type="text" id="region" name="region" placeholder="예: 대전광역시 중구, 서울시 강남구" required />
    </div>

    <!-- F열: 직군 선택 -->
    <div class="form-group">
      <label>직군 선택</label>
      <div class="btn-group">
        <button type="button" class="btn-option btn-job" onclick="selectOption(this, 'job', '직장인')">직장인</button>
        <button type="button" class="btn-option btn-job" onclick="selectOption(this, 'job', '자영업/사업자')">자영업/사업자</button>
        <button type="button" class="btn-option btn-job" onclick="selectOption(this, 'job', '전문직')">전문직</button>
        <button type="button" class="btn-option btn-job" onclick="selectOption(this, 'job', '기타/무직')">기타/무직</button>
      </div>
      <input type="hidden" id="job" name="job" required />
    </div>

    <!-- G열: 관심 분야 -->
    <div class="form-group">
      <label>관심 분야 (중복 선택 가능)</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="interest" value="암/뇌/심질환 보장"> 암·뇌·심질환</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="간병/요양 보장"> 간병·요양</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="노후/은퇴/연금 플랜"> 노후·은퇴플랜</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="운전자/자동차 보험"> 운전자·자동차</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="보장분석/보험 리모델링"> 보장분석·리모델링</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="자산관리/저축 플랜"> 자산관리·저축</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="절세/세무 상담"> 절세·세무상담</label>
      </div>
    </div>

    <!-- H열: 희망 상담 시간 -->
    <div class="form-group">
      <label for="preferredTime">희망 상담 시간</label>
      <select id="preferredTime" name="preferredTime" required>
        <option value="" disabled selected>상담 희망 시간을 선택해주세요</option>
        <option value="언제나 가능">언제나 가능 (빠른 상담)</option>
        <option value="오전 (09:00 ~ 12:00)">오전 (09:00 ~ 12:00)</option>
        <option value="오후 (12:00 ~ 18:00)">오후 (12:00 ~ 18:00)</option>
        <option value="야간/저녁 (18:00 ~ 21:00)">야간/저녁 (18:00 ~ 21:00)</option>
        <option value="주말 가능">주말 가능</option>
      </select>
    </div>

    <!-- I열: 희망 상담 방식 -->
    <div class="form-group">
      <label>희망 상담 방식</label>
      <div class="btn-group-3">
        <button type="button" class="btn-option btn-contact" onclick="selectOption(this, 'contactMethod', '전화 상담')">📞 전화</button>
        <button type="button" class="btn-option btn-contact" onclick="selectOption(this, 'contactMethod', '문자 상담')">💬 문자</button>
        <button type="button" class="btn-option btn-contact" onclick="selectOption(this, 'contactMethod', '카카오톡')">🟡 카카오톡</button>
      </div>
      <input type="hidden" id="contactMethod" name="contactMethod" required />
    </div>

    <!-- J열: 메모 -->
    <div class="form-group">
      <label for="memo">상담 요청/메모 (선택)</label>
      <textarea id="memo" name="memo" placeholder="궁금하신 내용이나 요청사항을 적어주세요."></textarea>
    </div>

    <!-- 개인정보 수집 동의 -->
    <div class="privacy-box">
      <label style="margin: 0; cursor: pointer;">
        <input type="checkbox" id="privacyAgree" required /> 개인정보 수집 및 이용 동의 (필수)
      </label>
      <span class="privacy-link" onclick="togglePrivacyModal(true)">[내용보기]</span>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">24시간 무료 맞춤 상담 신청하기</button>
  </form>
</div>

<!-- 약관 모달 -->
<div class="modal" id="privacyModal">
  <div class="modal-content">
    <h3>개인정보 수집 및 이용 동의</h3>
    <br/>
    <p>1. 수집 항목: 이름, 연락처, 주민등록번호, 거주지역, 직군, 관심분야, 희망시간, 희망방식, 메모</p>
    <p>2. 이용 목적: 무료 자산 및 보험 컨설팅 상담 제공</p>
    <p>3. 보유 기간: 목적 달성 시 또는 신청자의 삭제 요청 시까지</p>
    <br/>
    <p>※ 동의를 거부할 수 있으나, 상담 서비스 제공이 제한될 수 있습니다.</p>
    <button type="button" class="modal-close" onclick="togglePrivacyModal(false)">닫기</button>
  </div>
</div>

<script>
  // 업데이트된 구글 앱스 스크립트 웹 앱 URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfJR8-pnXldbjPowAJZ7B_GaO2mxYf51iKZAS4DPBMITaaRQPINgUiFcdfX2yJzJZOEA/exec";

  // 전화번호 자동 하이픈
  document.getElementById('phone').addEventListener('input', function (e) {
    let val = e.target.value.replace(/[^0-9]/g, '');
    if (val.length < 4) {
      e.target.value = val;
    } else if (val.length < 8) {
      e.target.value = val.substr(0, 3) + '-' + val.substr(3);
    } else {
      e.target.value = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
    }
  });

  // 주민등록번호 제어 및 포커스 이동
  const rrn1 = document.getElementById('rrn1');
  const rrn2 = document.getElementById('rrn2');

  function handleRrn1(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value.length >= 6) {
      e.target.value = e.target.value.slice(0, 6);
      rrn2.focus();
    }
  }

  function handleRrn2(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value.length > 7) {
      e.target.value = e.target.value.slice(0, 7);
    }
  }

  rrn1.addEventListener('input', handleRrn1);
  rrn1.addEventListener('keyup', handleRrn1);
  rrn2.addEventListener('input', handleRrn2);
  rrn2.addEventListener('keyup', handleRrn2);

  // 선택 버튼 공통 함수
  function selectOption(btn, targetId, val) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(targetId).value = val;
  }

  // 모달
  function togglePrivacyModal(show) {
    document.getElementById('privacyModal').style.display = show ? 'flex' : 'none';
  }

  // 폼 제출
  document.getElementById('consultForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const job = document.getElementById('job').value;
    if (!job) {
      alert("직군을 선택해 주세요.");
      return;
    }

    const contactMethod = document.getElementById('contactMethod').value;
    if (!contactMethod) {
      alert("희망 상담 방식을 선택해 주세요.");
      return;
    }

    const preferredTime = document.getElementById('preferredTime').value;
    if (!preferredTime) {
      alert("희망 상담 시간을 선택해 주세요.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "전송 중입니다...";

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const rrn = rrn1.value + '-' + rrn2.value;
    const region = document.getElementById('region').value;
    const memo = document.getElementById('memo').value;

    const interests = [];
    document.querySelectorAll('input[name="interest"]:checked').forEach(cb => {
      interests.push(cb.value);
    });

    const formData = new FormData();
    formData.append('name', name);
    formData.append('phone', phone);
    formData.append('rrn', rrn);
    formData.append('region', region);
    formData.append('job', job);
    formData.append('interests', interests.join(', '));
    formData.append('preferredTime', preferredTime);
    formData.append('contactMethod', contactMethod);
    formData.append('memo', memo);

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: formData    
    })    
    .then(() => {
      alert("성공적으로 상담 신청이 완료되었습니다!");
      document.getElementById('consultForm').reset();
      document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
    })    
    .catch(err => {
      console.error(err);
      alert("전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
    })    
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "24시간 무료 맞춤 상담 신청하기";
    });    
  });    
</script>    

</body>    
</html>
