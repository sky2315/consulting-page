<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>24시간 맞춤 자산·보험 무료 컨설팅</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 24px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #1e3a8a;
      font-size: 22px;
      margin-bottom: 8px;
      writing-mode: horizontal-tb !important;
      word-break: keep-all;
    }
    p.subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
      writing-mode: horizontal-tb !important;
      word-break: keep-all;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
      writing-mode: horizontal-tb !important;
      word-break: keep-all;
    }
    input[type="text"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px !important;
      -webkit-appearance: none;
      outline: none;
      transition: border-color 0.2s;
      writing-mode: horizontal-tb !important;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus {
      border-color: #2563eb;
    }
    
    /* 주민등록번호 모바일 레이아웃 고정 */
    .rrn-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .rrn-container input {
      flex: 1;
      width: 0; /* flex 레이아웃 내 폭 고정 해제 및 가로 확장 */
      min-width: 0;
      text-align: center;
    }
    .rrn-dash {
      font-size: 18px;
      font-weight: bold;
      color: #555;
      flex-shrink: 0;
    }

    /* 직군 버튼 2열 가로 배치 */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
    }
    .btn-job {
      width: 100%;
      height: 48px;
      padding: 0 8px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap; /* 글자 세로 줄바꿈 방지 */
      writing-mode: horizontal-tb !important;
    }
    .btn-job.active {
      background-color: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    /* 관심분야 체크박스 */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      writing-mode: horizontal-tb !important;
      word-break: keep-all;
    }
    .checkbox-item input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 개인정보 동의 및 모달 */
    .privacy-box {
      margin-top: 20px;
      font-size: 13px;
      color: #555;
      background-color: #f8fafc;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      writing-mode: horizontal-tb !important;
    }
    .privacy-link {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
      margin-left: 5px;
    }
    .submit-btn {
      width: 100%;
      height: 52px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
      writing-mode: horizontal-tb !important;
    }
    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    /* Modal 레이어 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
    }
    .modal-close {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>24시간 맞춤 무료 컨설팅</h2>
  <p class="subtitle">전문가와의 1:1 맞춤 무료 상담을 신청하세요.</p>

  <form id="consultForm">
    <!-- 성함 -->
    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" required />
    </div>

    <!-- 연락처 -->
    <div class="form-group">
      <label for="phone">연락처</label>
      <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" maxlength="13" required />
    </div>

    <!-- 주민등록번호 -->
    <div class="form-group">
      <label for="rrn1">주민등록번호</label>
      <div class="rrn-container">
        <input 
          type="tel" 
          id="rrn1" 
          name="rrn1" 
          maxlength="6" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          placeholder="앞 6자리" 
          autocomplete="off" 
          required 
        />
        <span class="rrn-dash">-</span>
        <input 
          type="password" 
          id="rrn2" 
          name="rrn2" 
          maxlength="7" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          placeholder="뒤 7자리" 
          autocomplete="off" 
          required 
        />
      </div>
    </div>

    <!-- 직군 선택 -->
    <div class="form-group">
      <label>직군 선택</label>
      <div class="btn-group">
        <button type="button" class="btn-job" onclick="selectJob(this, '직장인')">직장인</button>
        <button type="button" class="btn-job" onclick="selectJob(this, '자영업/사업자')">자영업/사업자</button>
        <button type="button" class="btn-job" onclick="selectJob(this, '전문직')">전문직</button>
        <button type="button" class="btn-job" onclick="selectJob(this, '기타/무직')">기타/무직</button>
      </div>
      <input type="hidden" id="job" name="job" required />
    </div>

    <!-- 관심 분야 -->
    <div class="form-group">
      <label>관심 분야 (중복 선택 가능)</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" name="interest" value="보장분석/보험 리모델링"> 보장분석</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="자산관리/저축 플랜"> 자산관리</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="절세/세무 상담"> 절세상담</label>
        <label class="checkbox-item"><input type="checkbox" name="interest" value="은퇴/연금 플랜"> 은퇴연금</label>
      </div>
    </div>

    <!-- 개인정보 수집 동의 -->
    <div class="privacy-box">
      <label style="margin: 0; cursor: pointer;">
        <input type="checkbox" id="privacyAgree" required /> 개인정보 수집 및 이용 동의 (필수)
      </label>
      <span class="privacy-link" onclick="togglePrivacyModal(true)">[내용보기]</span>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">24시간 무료 맞춤 상담 신청하기</button>
  </form>
</div>

<!-- 약관 모달 -->
<div class="modal" id="privacyModal">
  <div class="modal-content">
    <h3>개인정보 수집 및 이용 동의</h3>
    <br/>
    <p>1. 수집 항목: 이름, 연락처, 주민등록번호, 직군, 관심분야</p>
    <p>2. 이용 목적: 무료 자산 및 보험 컨설팅 상담 제공</p>
    <p>3. 보유 기간: 목적 달성 시 또는 신청자의 삭제 요청 시까지</p>
    <br/>
    <p>※ 동의를 거부할 수 있으나, 상담 서비스 제공이 제한될 수 있습니다.</p>
    <button type="button" class="modal-close" onclick="togglePrivacyModal(false)">닫기</button>
  </div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUv4BlfLuPtHgIV7IWiZ7Kia5NUBDdXaNKeeH-_O3MBhRw-szE-vDKoIkUoRKUQ7LW2g/exec";

  // 전화번호 자동 하이픈 (-)
  document.getElementById('phone').addEventListener('input', function (e) {
    let val = e.target.value.replace(/[^0-9]/g, '');
    if (val.length < 4) {
      e.target.value = val;
    } else if (val.length < 8) {
      e.target.value = val.substr(0, 3) + '-' + val.substr(3);
    } else {
      e.target.value = val.substr(0, 3) + '-' + val.substr(3, 4) + '-' + val.substr(7, 4);
    }
  });

  // 주민등록번호 제어 및 모바일 포커스 이동
  const rrn1 = document.getElementById('rrn1');
  const rrn2 = document.getElementById('rrn2');

  function handleRrn1(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value.length >= 6) {
      e.target.value = e.target.value.slice(0, 6);
      rrn2.focus();
    }
  }

  function handleRrn2(e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value.length > 7) {
      e.target.value = e.target.value.slice(0, 7);
    }
  }

  rrn1.addEventListener('input', handleRrn1);
  rrn1.addEventListener('keyup', handleRrn1);
  rrn2.addEventListener('input', handleRrn2);
  rrn2.addEventListener('keyup', handleRrn2);

  // 직군 선택
  function selectJob(btn, val) {
    document.querySelectorAll('.btn-job').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('job').value = val;
  }

  // 개인정보 약관 모달
  function togglePrivacyModal(show) {
    document.getElementById('privacyModal').style.display = show ? 'flex' : 'none';
  }

  // 폼 제출 처리
  document.getElementById('consultForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const job = document.getElementById('job').value;
    if (!job) {
      alert("직군을 선택해 주세요.");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "전송 중입니다...";

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const rrn = rrn1.value + '-' + rrn2.value;

    const interests = [];
    document.querySelectorAll('input[name="interest"]:checked').forEach(cb => {
      interests.push(cb.value);
    });

    const formData = new FormData();
    formData.append('name', name);
    formData.append('phone', phone);
    formData.append('rrn', rrn);
    formData.append('job', job);
    formData.append('interests', interests.join(', '));

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.result === 'success') {
        alert("성공적으로 상담 신청이 완료되었습니다!");
        document.getElementById('consultForm').reset();
        document.querySelectorAll('.btn-job').forEach(b => b.classList.remove('active'));
      } else {          
        alert("전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
      }
    })          
    .catch(err => {
      console.error(err);
      alert("전송 중 오류가 발생했습니다.");
    })          
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "24시간 무료 맞춤 상담 신청하기";
    });          
  });          
</script>          

</body>          
</html>
